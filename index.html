.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}.modal-panel{background:#fff;color:#171717;border-radius:18px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 70px #0008}.modal-head{padding:16px 18px;border-bottom:1px solid #ddd;font-weight:900;font-size:19px}.modal-scroll{padding:16px 18px;overflow:auto;line-height:1.5}.modal-actions{padding:12px 16px;display:grid;gap:8px;border-top:1px solid #ddd}.modal-actions button{width:100%}.ad-qr{display:block;width:min(100%,390px);max-height:52vh;object-fit:contain;margin:8px auto;border-radius:10px}.ad-follow{font-weight:900;text-align:center;font-size:22px;color:#d83d75;margin:6px 0}.exercise-link{color:inherit;text-decoration:underline;text-decoration-color:var(--yellow);text-decoration-thickness:2px;text-underline-offset:3px}.reorder{display:flex;gap:5px}.reorder button{padding:6px 9px}.ref-video{font-size:12px;margin-left:5px}.chart-wrap{width:100%;overflow:hidden}.readonly-day{border-top:1px solid var(--line);padding:10px 0}.readonly-day h4{margin:0 0 6px}.privacy-copy{max-height:190px;overflow:auto;padding:0 2px}.ad-qr{cursor:pointer}.pro-active{background:#e8f8eb;border:1px solid #9bd3a5;padding:9px;border-radius:9px;color:#14532d;font-weight:800}

<body><div class="app">
<header class="top"><div class="brandlockup"><img class="brand-logo" src="gym-log-logo.png" alt="Logotipo GYM LOG"><div class="brandtext"><div class="brand">GYM <span>LOG</span></div></div></div><div class="row top-actions"><button class="ghost small" data-action="share-link">Compartir Gymlog</button><button id="quickResume" class="secondary hidden">Reanudar</button></div><small id="topSub" class="top-tagline">Tu entrenamiento, sin complicaciones</small></header><div class="version-tag" aria-label="Versión 1.14">v1.14</div>
<nav class="nav" id="nav">
<button data-page="home" class="active"><span class="ico">⌂</span>Inicio</button><button data-page="routines"><span class="ico">▤</span>Rutinas</button><button data-page="library"><span class="ico">＋</span>Biblioteca</button><button data-page="calculators"><span class="ico">▦</span>Calculadoras</button><button data-page="history"><span class="ico">◷</span>Historial</button><button data-page="progress"><span class="ico">↗</span>Progreso</button><button data-page="settings"><span class="ico">⚙</span>Ajustes</button>
</nav><main id="main"></main></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const memoryStore=Object.create(null);
function readStored(key){try{return localStorage.getItem(key)}catch(e){}try{return sessionStorage.getItem(key)}catch(e){}return Object.prototype.hasOwnProperty.call(memoryStore,key)?memoryStore[key]:null}
function writeStored(key,value){try{localStorage.setItem(key,value);return true}catch(e){}try{sessionStorage.setItem(key,value);return true}catch(e){}memoryStore[key]=value;return true}
function removeStored(key){try{localStorage.removeItem(key);return}catch(e){}try{sessionStorage.removeItem(key);return}catch(e){}delete memoryStore[key]}
const exercise=(name,group,sub='General',equipment='Máquina')=>({id:uid(),name,group,subgroup:sub,equipment,variant:'',isCustom:false});
// El catálogo oficial procede exclusivamente de data/ejercicios.xlsx.
let db;
function findCatId(name){return db?.library?.find(x=>x.name===name)?.id||name;}
function seed(){
 db={version:1,library:[],routines:[],sessions:[],activeSession:null,
  settings:{unit:'kg',autoTimer:true,compound:120,isolation:120,backupReminder:{mode:'ask',until:0}},
  lastRoutine:null,lastDay:null};
}
const TEMPLATE_NAMES=['Full Body de 2 días','Push Pull Legs de 3 días','Hipertrofia de 5 días','Plan de entrenamiento — 5 días','TABLA DE ENTRENAMIENTO','Rutina híbrida — 5 días'];
function ensureDefaultTemplates(){} // Solo data/routines.json es la fuente de las plantillas.
function ensureDobleTemplates(){}

function normalizeDatabase({legacyActiveFallback=false}={}){
 if(!Array.isArray(db.library))db.library=[];
 if(!Array.isArray(db.routines))db.routines=[];
 if(!Array.isArray(db.sessions))db.sessions=[];
 db.settings={unit:'kg',autoTimer:true,compound:120,isolation:120,backupReminder:{mode:'ask',until:0},...(db.settings||{})};
 if(!db.settings.backupReminder)db.settings.backupReminder={mode:'ask',until:0};if(!db.settings.timerDefaultsV110){if(Number(db.settings.compound)===150)db.settings.compound=120;if(Number(db.settings.isolation)===90)db.settings.isolation=120;db.settings.timerDefaultsV110=true;}
 // Migración de nombres antiguos de plantillas a los nombres oficiales.
 const routineRenames={
  'Plan entrenamiento DobleJotaGym 1':'Plan de entrenamiento — 5 días',
  'Plan entrenamiento DobleJotaGym 2':'TABLA DE ENTRENAMIENTO',
  'Rutina híbrida de 5 días':'Rutina híbrida — 5 días'
 };
 db.routines.forEach(r=>{if(routineRenames[r.name])r.name=routineRenames[r.name];if(r.name==='Rutina híbrida — 5 días')r.proOnly=true});
 db.routines.forEach(r=>{if(typeof r.isTemplate!=='boolean')r.isTemplate=TEMPLATE_NAMES.includes(r.name);if(typeof r.active!=='boolean')r.active=false;if(!Array.isArray(r.days))r.days=[];r.days.forEach(d=>{if(!d.id)d.id=uid();if(!Array.isArray(d.exercises))d.exercises=[]})});
 ensureDefaultTemplates();
 ensureDobleTemplates();
 if(!db.lastRoutine){const legacy=db.routines.filter(r=>r.active);if(legacy.length===1&&legacy[0].isTemplate&&legacy[0].name==='Rutina híbrida de 5 días')legacy[0].active=false;}
 if(db.activeSession===undefined)db.activeSession=null;
 // No se activa ninguna rutina automáticamente al abrir Inicio.
}
function load(){
 let parsed=null;
 try{parsed=JSON.parse(readStored('gymlog_db'))}catch(e){}
 if(!parsed||!Array.isArray(parsed.routines)||!Array.isArray(parsed.library)){seed();normalizeDatabase();save();return}
 db=parsed;
 const legacyActiveFallback=!db.routines.some(r=>typeof r.active==='boolean');
 normalizeDatabase({legacyActiveFallback});
 save();
}

function calendarWeeks(){

 const weeks=[];for(let w=0;w<12;w++){const days=[];const weekStart=new Date(first);weekStart.setDate(first.getDate()+w*7);const monthLabel=weekStart.toLocaleDateString('es-ES',{month:'short'}).replace('.','');for(let i=0;i<7;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const isToday=d.getTime()===today.getTime();const future=d>today;const sessions=byDate.get(key)||[];const title=`${d.toLocaleDateString('es-ES',{dateStyle:'full'})}${sessions.length?' · '+sessions.length+' entrenamiento(s) registrado(s)':' · Sin entrenamiento registrado'}`;days.push(`<button type="button" class="calendar-day ${sessions.length?'trained':''} ${isToday?'today':''} ${future?'future':''}" data-calendar-date="${key}" title="${esc(title)}" aria-label="${esc(title)}" ${future?'disabled':''}>${d.getDate()}</button>`)}weeks.push(`<div class="calendar-week"><div class="calendar-month">${esc(monthLabel)}</div>${days.join('')}</div>`)}return weeks.join('')

function applyCatalog(newExercises,status){

 for(const r of db.routines){if(r.isTemplate)continue;for(const d of r.days||[])for(const ex of d.exercises||[])if(ex.exerciseId)idsReferenced.add(ex.exerciseId)}
 for(const session of db.sessions||[])for(const ex of session.exercises||[])if(ex.exerciseId)idsReferenced.add(ex.exerciseId);
 if(db.activeSession)for(const ex of db.activeSession.exercises||[])if(ex.exerciseId)idsReferenced.add(ex.exerciseId);
 const allIds=new Set(newExercises.map(x=>x.id));
 // No perder la ficha ni el historial de ejercicios antiguos usados en rutinas propias o sesiones.
 // Esas fichas se guardan como legado y no se muestran en el catálogo de selección.
 const legacy=db.library.filter(x=>!x.isCustom&&!allIds.has(x.id)&&idsReferenced.has(x.id)).map(x=>({...x,legacyOnly:true}));
 db.library=[...newExercises,...retained.filter(x=>!allIds.has(x.id)),...legacy.filter(x=>!allIds.has(x.id))];

}
async function syncExternalCatalog(){

  if(Array.isArray(window.__GYMLOG_CATALOG__)){applyCatalog(catalogFromEmbedded(window.__GYMLOG_CATALOG__),'Catálogo integrado para pruebas');return;}
  const response=await fetch('data/ejercicios.xlsx',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const rows=await xlsxRows(await response.arrayBuffer());
  applyCatalog(mapCatalogRows(rows),'Excel externo actualizado');

  console.error('No se pudo cargar el Excel:',error);

   const response=await fetch('data/exercises-fallback.json',{cache:'no-store'});
   if(!response.ok)throw Error('Sin copia alternativa');
   applyCatalog(catalogFromEmbedded(await response.json()),'Copia alternativa; revisa data/ejercicios.xlsx');
  }catch(e){catalogStatus='ERROR al cargar el Excel: '+(error.message||error);render();}
 }
}

function progressView(){

 const map=new Map();sessions.forEach(s=>s.exercises.forEach(e=>{const rawName=e.exerciseNameSnapshot||e.name||'Ejercicio',libEx=db.library.find(z=>z.id===e.exerciseId),ref=findReference(e)||findReference(libEx||{}),name=rawName,key=(e.exerciseId||rawName)+'|'+(e.variant||'');if(!map.has(key))map.set(key,{key,name,variant:e.variant||'',records:[]});e.sets.filter(x=>x.completed&&x.weight!==''&&x.reps!==''&&Number(x.weight)>=0&&Number(x.reps)>0).forEach(x=>map.get(key).records.push({date:s.completedAt,weight:Number(x.weight),reps:Number(x.reps),sessionId:s.id}))}));

 const chartFor=x=>{if(!x)return '';const toKg=v=>db.settings.unit==='lb'?v*0.45359237:v;const pts=x.records.map(p=>({...p,weight:toKg(p.weight)}));const last=pts[pts.length-1];const oneRM=last.weight*(1+last.reps/30);const targets=[20,18,16,14,12,10,8,6,4,2,1];const estimates=targets.map(r=>({weight:Math.max(0,Math.round((oneRM/(1+r/30))*2)/2),reps:r})).filter(p=>p.weight>0&&p.reps<=20);const allW=[...pts.map(p=>p.weight),...estimates.map(p=>p.weight)];let minW=Math.max(0,Math.floor(Math.min(...allW)/5)*5),maxW=Math.ceil(Math.max(...allW)/5)*5;if(maxW-minW<20)maxW=minW+20;if(maxW===minW)maxW=minW+20;const left=52,right=362,top=18,bottom=218;const X=w=>left+(w-minW)/(maxW-minW)*(right-left),Y=r=>bottom-(r-1)/19*(bottom-top);const ticks=[];for(let w=minW;w<=maxW;w+=5)ticks.push(w);return `<div class="card" id="progressChart"><div class="subtitle">${esc(x.name)}${x.variant?' · '+esc(x.variant):''}</div><div class="chart-legend"><span><i class="chart-swatch" style="background:#ed1c24"></i>Registros reales</span><span><i class="chart-swatch" style="background:#e2b900"></i>Estimaciones</span></div><p class="small muted">Cada punto representa una serie completada. Las estimaciones son orientativas, calculadas mediante Epley; no son marcas reales ni objetivos.</p><div class="chart-wrap"><svg class="progress-chart" viewBox="0 0 390 258" role="img" aria-label="Peso en kilogramos en el eje horizontal, de cinco en cinco; repeticiones en el eje vertical, de una a veinte"><line x1="${left}" y1="${top}" x2="${left}" y2="${bottom}" stroke="#777"/><line x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}" stroke="#777"/>${Array.from({length:20},(_,i)=>i+1).map(v=>`<line x1="${left}" y1="${Y(v)}" x2="${right}" y2="${Y(v)}" stroke="#e9e9e9"/><text x="${left-9}" y="${Y(v)+2.5}" text-anchor="end" font-size="7.5" fill="#555">${v}</text>`).join('')}${ticks.map(v=>`<line x1="${X(v)}" y1="${top}" x2="${X(v)}" y2="${bottom}" stroke="#f0f0f0"/><line x1="${X(v)}" y1="${bottom}" x2="${X(v)}" y2="${bottom+4}" stroke="#777"/><text x="${X(v)}" y="${bottom+15}" text-anchor="middle" font-size="8" fill="#555">${v}</text>`).join('')}<text x="${(left+right)/2}" y="253" text-anchor="middle" font-size="9" fill="#444">Peso (kg)</text><text x="13" y="${(top+bottom)/2}" text-anchor="middle" font-size="9" fill="#444" transform="rotate(-90 13 ${(top+bottom)/2})">Repeticiones</text>${pts.map(p=>`<circle cx="${X(p.weight)}" cy="${Y(Math.max(1,Math.min(20,p.reps)))}" r="3.6" fill="#ed1c24" stroke="#111" stroke-width=".7"><title>Real: ${p.weight.toFixed(1).replace(/\.0$/,'')} kg × ${p.reps} repeticiones · ${new Date(p.date).toLocaleDateString('es-ES')}</title></circle>`).join('')}${estimates.map(p=>`<circle cx="${X(p.weight)}" cy="${Y(p.reps)}" r="3.6" fill="#ffd400" stroke="#111" stroke-width=".7"><title>Estimación: ${p.weight.toFixed(1).replace(/\.0$/,'')} kg × ${p.reps} repeticiones</title></circle>`).join('')}</svg></div><div class="small">Última serie real: <b>${last.weight.toFixed(1).replace(/\.0$/,'')} kg × ${last.reps}</b></div><div class="small muted">Estimaciones orientativas: ${estimates.map(p=>`${p.weight} × ${p.reps}`).join(' · ')}</div></div>`};

   ${useFat?`<div><label for="calcFat">Grasa corporal (%)</label><input type="number" id="calcFat" data-calc-field="fat" min="1" max="80" step="0.1" placeholder="Ej. 20" value="${esc(c.fat)}"></div>`:''}
   ${isGet?`<div style="grid-column:1/-1"><label for="calcActivity">Actividad diaria aproximada</label><select id="calcActivity" data-calc-field="activity"><option value="1.2" ${c.activity==='1.2'?'selected':''}>Sedentaria (×1,20)</option><option value="1.37" ${c.activity==='1.37'?'selected':''}>Ligera (×1,37)</option><option value="1.55" ${c.activity==='1.55'?'selected':''}>Moderada (×1,55)</option><option value="1.72" ${c.activity==='1.72'?'selected':''}>Alta (×1,72)</option><option value="1.9" ${c.activity==='1.9'?'selected':''}>Muy alta (×1,90)</option></select></div>`:''}`:''}
 </div><div id="calcResult" class="calc-result" aria-live="polite"></div>
 <p class="calc-hint">Los resultados son orientativos: la edad afecta a la TMB y determina cómo interpretar el IMC, pero <b>en adultos desde 20 años los límites del IMC no cambian automáticamente con la edad</b>. El IMC debe valorarse junto con la musculatura, cintura y situación de salud.</p>
 <p class="small muted">Referencias: <a href="https://www.cdc.gov/bmi/adult-calculator/bmi-categories.html" target="_blank" rel="noopener noreferrer">CDC · adultos</a> · <a href="https://www.cdc.gov/bmi/child-teen-calculator/" target="_blank" rel="noopener noreferrer">CDC · menores de 20</a> · <a href="https://www.who.int/news-room/fact-sheets/detail/obesity-and-overweight" target="_blank" rel="noopener noreferrer">OMS</a>.</p></div>`;
}
function calcNumber(value){if(value===''||value===null||value===undefined)return NaN;const v=Number(String(value).replace(',','.'));return Number.isFinite(v)?v:NaN}
function calcResult(){
 const c=calcState,out=$('#calcResult');if(!out)return;
 const weight=calcNumber(c.weight)*(c.unit==='imperial'?0.45359237:1),height=calcNumber(c.height)*(c.unit==='imperial'?2.54:1),age=calcNumber(c.age),fat=calcNumber(c.fat);
 const format=v=>Math.round(v).toLocaleString('es-ES'),decimal=v=>Number(v).toLocaleString('es-ES',{maximumFractionDigits:1,minimumFractionDigits:1});
 if(!Number.isFinite(weight)||weight<15||weight>500||!Number.isFinite(height)||height<100||height>250){out.innerHTML='<div class="small muted">Introduce un peso y una altura válidos para obtener el resultado.</div>';return}
 if(!Number.isFinite(age)||!Number.isInteger(age)||age<2||age>110){out.innerHTML='<div class="small muted">Introduce tu edad en años completos para interpretar correctamente el resultado.</div>';return}
 if(c.type==='imc'){
  const bmi=weight/Math.pow(height/100,2),bmiTxt=decimal(bmi),m=height/100;
  if(age<20){out.innerHTML=`<div class="muted small">IMC calculado</div><div class="calc-number">${bmiTxt}</div><div class="calc-explain"><b>Edad: ${age} años.</b> No mostramos «normopeso», «sobrepeso» ni «obesidad» usando límites de adultos, porque antes de los 20 años deben emplearse referencias específicas por edad y sexo (percentiles de IMC para la edad). El número del IMC sí se calcula igual, pero no se interpreta igual.<p><a href="https://www.cdc.gov/bmi/child-teen-calculator/" target="_blank" rel="noopener noreferrer">Consultar la calculadora específica para menores de 20 años (CDC)</a>.</p></div>`;return}
  const label=bmi<18.5?'Bajo peso':bmi<25?'Peso saludable':bmi<30?'Sobrepeso':bmi<35?'Obesidad · grado I':bmi<40?'Obesidad · grado II':'Obesidad · grado III';
  const why=bmi<18.5?'Tu resultado está por debajo de 18,5.':bmi<25?'Tu resultado está entre 18,5 y menos de 25.':bmi<30?`Tu resultado ${bmiTxt} supera el umbral de 25,0 y todavía es inferior a 30,0. Por eso aparece la categoría «sobrepeso», aunque eso no demuestra por sí solo exceso de grasa.`:`Tu resultado ${bmiTxt} es igual o superior a 30,0. El intervalo concreto determina el grado.`;
  const kgLow=18.5*m*m,kgHigh=25*m*m,meterText=m.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2});
  const bodyNote=age>=65?'A partir de edades avanzadas, el IMC puede perder precisión para representar masa muscular, fragilidad y distribución grasa. Conviene interpretar el resultado individualmente.':'La masa muscular puede elevar el IMC sin que implique necesariamente exceso de grasa. Tampoco muestra dónde se distribuye la grasa.';
  out.innerHTML=`<div class="muted small">IMC calculado · ${age} años</div><div class="calc-number">${bmiTxt}</div><b>${esc(label)}</b><div class="calc-explain"><b>¿Por qué esa categoría?</b> ${why}<p><b>Fórmula:</b> ${decimal(weight)} kg ÷ (${meterText} m × ${meterText} m) = ${bmiTxt} kg/m².</p><p><b>Guía de categorías para personas desde 20 años:</b></p>
  <div class="calc-scale"><span class="${bmi<18.5?'calc-current':''}">Menos de 18,5 · Bajo peso</span><span class="${bmi>=18.5&&bmi<25?'calc-current':''}">18,5 a menos de 25 · Peso saludable</span><span class="${bmi>=25&&bmi<30?'calc-current':''}">25 a menos de 30 · Sobrepeso</span><span class="${bmi>=30?'calc-current':''}">30 o más · Obesidad (3 grados)</span></div>
  <p>Para tu altura, el intervalo correspondiente al IMC 18,5–24,9 equivale matemáticamente a unos <b>${format(kgLow)}–${format(kgHigh)} kg</b>. No es un peso objetivo personalizado.</p>
  <p><b>Importante:</b> ${bodyNote} También cuentan la cintura, actividad física, antecedentes y parámetros clínicos. El IMC es una herramienta inicial, no un diagnóstico.</p><p>En adultos los umbrales son iguales a los 25, 45 o 70 años; la edad no modifica directamente la fórmula ni convierte un IMC de 26 en «normal».</p></div>`;return;
 }
 if(age<18){out.innerHTML='<div class="small muted">Estas fórmulas de TMB y GET no se presentan como válidas para menores de 18 años. Consulta orientación profesional adecuada a la edad.</div>';return}
 let bmr,formulaLabel,formulaText;
 if(c.formula==='katch'){
  if(!Number.isFinite(fat)||fat<=0||fat>=80){out.innerHTML='<div class="small muted">Introduce un porcentaje de grasa corporal válido (más de 0 y menos de 80 %) para usar Katch-McArdle.</div>';return}
  bmr=370+21.6*weight*(1-fat/100);formulaLabel='Katch-McArdle';formulaText=`370 + 21,6 × masa libre de grasa (${decimal(weight*(1-fat/100))} kg)`;
 }else if(c.formula==='harris'){
  bmr=c.sex==='hombre'?88.362+13.397*weight+4.799*height-5.677*age:447.593+9.247*weight+3.098*height-4.330*age;
  formulaLabel='Harris-Benedict revisada';formulaText='Ecuación de Harris-Benedict revisada: peso, altura, edad y sexo';
 }else{
  bmr=10*weight+6.25*height-5*age+(c.sex==='hombre'?5:-161);formulaLabel='Mifflin-St Jeor';formulaText=`10 × ${decimal(weight)} + 6,25 × ${decimal(height)} − 5 × ${age} ${c.sex==='hombre'?'+ 5':'− 161'}`;
 }
 const explain=`<div class="calc-explain"><b>Cómo se ha calculado</b><p>Fórmula: ${esc(formulaLabel)}. ${esc(formulaText)}.</p><p>Edad utilizada: <b>${age} años</b>. La TMB es la energía estimada en reposo: no incluye toda la actividad diaria, entrenamiento ni digestión. Es una aproximación estadística, no un valor medido.</p></div>`;
 if(c.type==='tmb'){out.innerHTML=`<div class="muted small">Tasa metabólica basal</div><div class="calc-number">${format(bmr)} kcal/día</div>${explain}<p class="calc-hint">Para estimar el gasto total, selecciona la pestaña GET. La TMB no es una recomendación para comer exactamente esa cantidad.</p>`;return}
 const activity=Number(c.activity)||1.55,get=bmr*activity;
 out.innerHTML=`<div class="muted small">Gasto energético total aproximado (mantenimiento)</div><div class="calc-number">${format(get)} kcal/día</div><div class="calc-explain"><b>Desglose</b><p>TMB: <b>${format(bmr)} kcal/día</b> · Actividad: <b>×${activity.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}</b>.</p><p><b>${format(bmr)} × ${activity.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})} = ${format(get)} kcal/día</b>.</p><p>El multiplicador es una hipótesis global sobre entrenamiento, pasos y actividad cotidiana. Dos personas que entrenan los mismos días pueden tener gastos distintos.</p><p>Utiliza esta cifra como punto de partida orientativo para interpretar tendencias durante varias semanas, no como consumo obligatorio.</p></div>${explain}`;
}
function bindCalculator(){
 $$('[data-calc-type]').forEach(b=>b.onclick=()=>{calcState.type=b.dataset.calcType;render()});
 $$('[data-calc-field]').forEach(input=>{
  const update=()=>{
   const prop=input.dataset.calcField,value=input.value;
   if(prop==='unit'&&value!==calcState.unit){
    const toImperial=value==='imperial';
    for(const field of ['weight','height']){
     const x=calcNumber(calcState[field]);if(Number.isFinite(x))calcState[field]=String(Math.round(x*(field==='weight'?(toImperial?2.20462262:0.45359237):(toImperial?1/2.54:2.54))*10)/10);
    }
    calcState.unit=value;render();return;
   }
   calcState[prop]=value;
   if(prop==='formula'){render();return}
   calcResult();
  };
  input.addEventListener('input',update);
  input.addEventListener('change',update);
 });
 calcResult();
}

nst sets=Math.floor(Number(overlay.querySelector('#routineExSets').value));const rest=Math.floor(Number(overlay.querySelector('#routineExRest').value));const reps=overlay.querySelector('#routineExReps').value.trim();if(!Number.isFinite(sets)||sets<1||sets>30){alert('Indica entre 1 y 30 series.');return}if(!Number.isFinite(rest)||rest<1||rest>3600){alert('El descanso debe estar entre 1 y 3600 segundos.');return}if(!reps){alert('Indica las repeticiones objetivo.');return}Object.assign(ex,{sets,reps,rest,variant:overlay.querySelector('#routineExVariant').value.trim(),notes:overlay.querySelector('#routineExNotes').value.trim()});close();redraw()};overlay.querySelector('#routineExSets').focus()}

function importText(){
 const html=`<div class="title">Crear rutina</div><div class="card"><p class="muted small">Pega tu entrenamiento tal como lo tengas escrito. Detectaremos los días, ejercicios, series y repeticiones. Podrás revisar y corregirlo antes de guardarlo.</p><div class="fieldgrid"><div><label for="importRoutineName">Nombre de la rutina</label><input id="importRoutineName" placeholder="Ej. Hipertrofia 4 días" value="Rutina importada"></div><div><label for="importDayCount">Número de días</label><select id="importDayCount">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${n===4?'selected':''}>${n} ${n===1?'día':'días'}</option>`).join('')}</select></div></div><label for="importSource" style="margin-top:12px">Texto de la rutina</label><textarea id="importSource" rows="13" placeholder="Día 1: Pecho y tríceps&#10;Press banca 4x12,10,8,6&#10;Aperturas en polea 3 x 12&#10;Fondos 3 series de 10 repeticiones&#10;&#10;Día 2: Espalda y bíceps&#10;Jalón al pecho 4x10&#10;Remo sentado 3x12"></textarea><div class="actions"><button id="parseText">Analizar rutina</button><button class="ghost" data-go="routines">Cancelar</button></div></div><div id="importPreview"></div>`;
 $('#main').innerHTML=html;
 $('#parseText').onclick=()=>{
  const source=$('#importSource').value.trim();if(!source){alert('Pega el texto de tu entrenamiento.');return}
  const routineName=$('#importRoutineName').value.trim()||'Rutina importada';
  const requestedDays=Math.max(1,Math.min(7,Number($('#importDayCount').value)||4));
  const lines=source.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const parsed=[];const headers=[];let currentHeader=null;
  const weekdayMap={'lunes':0,'martes':1,'miércoles':2,'miercoles':2,'jueves':3,'viernes':4,'sábado':5,'sabado':5,'domingo':6};
  const normalize=t=>String(t||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const findLocal=name=>{const n=normalize(name);let found=db.library.find(e=>normalize(e.name)===n)||db.library.find(e=>(e.aliases||[]).some(a=>normalize(a)===n))||null;return found};
  const addExercise=(raw,sets,reps,header)=>{raw=raw.replace(/^[-•*]\s*/,'').replace(/[\s:–—-]+$/,'').trim();if(!raw)return;const found=findLocal(raw);parsed.push({id:uid(),exerciseId:found?.id||raw,name:raw,variant:'',sets:Math.max(1,Math.min(30,Number(sets)||3)),reps:String(reps||'12').trim(),rest:120,notes:found?'':'Revisar ejercicio importado',metric:/s\b|seg|minuto/i.test(String(reps))?'duration':'reps',needsReview:!found,sourceHeader:header,dayIndex:null,referenceExerciseId:found?.referenceExerciseId||''})};
  const dayHeader=/^(?:(?:día|dia|day)\s*(\d+)?\s*[:.\-–—]?\s*(.*)|(?:lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b\s*[:.\-–—]?\s*(.*))$/i;
  const seriesPatterns=[
   /^(.+?)\s*[-:–—]?\s*(\d{1,2})\s*[x×]\s*(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*(?:\s*(?:s|seg|segundos|min|minutos|pasos|por\s+lado))?)\s*$/i,
   /^(.+?)\s*[-:–—]?\s*(\d{1,2})\s+series?\s+de\s+(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*)\s*(?:reps?|repeticiones?)?\s*$/i,
   /^(\d{1,2})\s*[x×]\s*(\d{1,2}(?:\s*[-–]\s*\d{1,2})?(?:\s*,\s*\d{1,2})*)\s+(.+)$/i
  ];
  for(let li=0;li<lines.length;li++){
   const line=lines[li];let m=null,kind=-1;for(let i=0;i<seriesPatterns.length;i++){m=line.match(seriesPatterns[i]);if(m){kind=i;break}}
   if(m){if(kind===2)addExercise(m[3],m[1],m[2],currentHeader);else addExercise(m[1],m[2],m[3],currentHeader);continue}
   const h=line.match(dayHeader);const weekday=line.toLocaleLowerCase('es').match(/^(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\b/);
   const isExplicitHeader=!!h||/[:：]$/.test(line)||/^(grupo|bloque|entrenamiento)\s*\d*/i.test(line);
   const nextLine=lines[li+1]||'';const nextIsExercise=seriesPatterns.some(p=>p.test(nextLine));const looksLikeGroup=/(pecho|espalda|pierna|hombro|brazo|bíceps|biceps|tríceps|triceps|glúteo|gluteo|femoral|cuádriceps|cuadriceps|core|full body|push|pull|legs)/i.test(line)&&line.length<45&&!/\d/.test(line)&&nextIsExercise;
   if(isExplicitHeader||looksLikeGroup){let idx=null,label=line.replace(/[:：]$/,'').trim();if(h&&h[1])idx=Math.max(0,Number(h[1])-1);else if(weekday)idx=weekdayMap[weekday[1]];currentHeader={label,index:idx,sequence:headers.length};headers.push(currentHeader);continue}
   // Una línea de ejercicio sin esquema explícito se conserva y recibe el valor estándar 3x12.
   addExercise(line,3,'12',currentHeader);
  }
  if(!parsed.length){alert('No he podido detectar ejercicios. Escribe al menos un ejercicio por línea; por ejemplo: Press banca 3x12.');return}
  const days=Array.from({length:requestedDays},(_,i)=>({id:uid(),name:`Día ${i+1}`,exercises:[]}));
  const explicit=parsed.some(e=>e.sourceHeader!==null);
  if(explicit){let next=0;const headerMap=new Map();for(const h of headers){let idx=Number.isInteger(h.index)?Math.min(requestedDays-1,Math.max(0,h.index)):Math.min(requestedDays-1,next);headerMap.set(h,idx);if(h.label)days[idx].name=h.label;next=Math.min(requestedDays-1,idx+1)}parsed.forEach((e,i)=>{let idx=e.sourceHeader?headerMap.get(e.sourceHeader):Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=Number.isInteger(idx)?idx:0;days[e.dayIndex].exercises.push(e)})}
  else parsed.forEach((e,i)=>{const idx=Math.min(requestedDays-1,Math.floor(i*requestedDays/parsed.length));e.dayIndex=idx;days[idx].exercises.push(e)});
  days.forEach((d,i)=>{if(!d.name||/^Día \d+$/.test(d.name))d.name=`Día ${i+1}`});
  let routine={id:uid(),name:routineName,days};
  const syncPreview=()=>{routine.name=$('#previewName')?.value.trim()||routine.name;routine.days.forEach((d,di)=>{const dayInput=$(`[data-prev-dayname="${di}"]`);if(dayInput)d.name=dayInput.value.trim()||`Día ${di+1}`;d.exercises.forEach((e,ei)=>{const n=$(`[data-prev-name="${di}-${ei}"]`),sets=$(`[data-prev-sets="${di}-${ei}"]`),reps=$(`[data-prev-reps="${di}-${ei}"]`);if(n)e.name=n.value.trim()||'Ejercicio';if(sets)e.sets=Math.max(1,Math.min(30,Number(sets.value)||3));if(reps)e.reps=reps.value.trim()||'12'})})};
  const renderPreview=()=>{$('#importPreview').innerHTML=`<div class="card"><div class="subtitle">Revisa tu rutina antes de guardarla</div><p class="muted small">Puedes cambiar nombres, series, repeticiones y mover ejercicios entre días. Los ejercicios no reconocidos se guardarán con el nombre que has escrito para que puedas corregirlos después.</p><label>Nombre</label><input id="previewName" value="${esc(routine.name)}">${routine.days.map((d,di)=>`<div class="card" style="margin-top:12px"><div class="row between"><input data-prev-dayname="${di}" value="${esc(d.name)}" aria-label="Nombre del día"><span class="pill">${d.exercises.length} ejercicios</span></div>${d.exercises.map((e,ei)=>`<div class="exercise"><div class="row between"><div style="flex:1;min-width:0"><input data-prev-name="${di}-${ei}" value="${esc(e.name)}"><div class="fieldgrid"><div><label>Series</label><input type="number" min="1" max="30" data-prev-sets="${di}-${ei}" value="${e.sets}"></div><div><label>Repeticiones</label><input data-prev-reps="${di}-${ei}" value="${esc(e.reps)}"></div></div>${e.needsReview?'<span class="pill">Revisar ejercicio</span>':''}</div><button type="button" class="ghost" data-prev-del="${e.id}">Quitar</button></div><label style="margin-top:8px">Mover a otro día</label><select data-prev-move="${e.id}">${routine.days.map((dest,k)=>`<option value="${k}" ${k===di?'selected':''}>${esc(dest.name)}</option>`).join('')}</select></div>`).join('')||'<p class="muted small">Sin ejercicios.</p>'}</div>`).join('')}<div class="actions"><button id="saveImported">Guardar rutina</button><button class="secondary" id="backImported">Volver al texto</button><button class="ghost" id="cancelImported">Cancelar</button></div></div>`;
   $$('[data-prev-dayname]').forEach(inp=>inp.onchange=()=>{syncPreview();routine.days[Number(inp.dataset.prevDayname)].name=inp.value.trim()||`Día ${Number(inp.dataset.prevDayname)+1}`;renderPreview()});
   $$('[data-prev-move]').forEach(sel=>sel.onchange=()=>{syncPreview();const exId=sel.dataset.prevMove;let from=-1,fromIndex=-1,obj=null;routine.days.forEach((d,di)=>{const ei=d.exercises.findIndex(e=>e.id===exId);if(ei>=0){from=di;fromIndex=ei;obj=d.exercises.splice(ei,1)[0]}});const to=Number(sel.value);if(obj&&to!==from)routine.days[to].exercises.push(obj);else if(obj)routine.days[from].exercises.splice(fromIndex,0,obj);renderPreview()});
   $$('[data-prev-del]').forEach(btn=>btn.onclick=()=>{syncPreview();routine.days.forEach(d=>d.exercises=d.exercises.filter(e=>e.id!==btn.dataset.prevDel));renderPreview()});
   $('#saveImported').onclick=()=>{syncPreview();if(!routine.name.trim()){alert('Escribe un nombre para la rutina.');return}if(!routine.days.some(d=>d.exercises.length)){alert('La rutina no tiene ejercicios.');return}routine.days.forEach(d=>d.exercises.forEach(e=>{let local=findLocal(e.name);if(!local){local=exercise(e.name,'General y funcional','General','Otro');local.isCustom=true;db.library.push(local)}e.exerciseId=local.id;e.referenceExerciseId=local.referenceExerciseId||e.referenceExerciseId||'';delete e.needsReview;delete e.sourceHeader;delete e.dayIndex}));routine.isTemplate=false;routine.active=true;db.routines.push(routine);if(!save()){db.routines=db.routines.filter(r=>r.id!==routine.id);return}go('routines');offerBackupReminder()};
   $('#backImported').onclick=()=>{syncPreview();$('#importPreview').innerHTML='';$('#importSource').focus()};$('#cancelImported').onclick=()=>go('routines');
  };renderPreview();
 };
}

 document.getElementById('shareGymModal')?.remove();
 const wrap=document.createElement('div');wrap.id='shareGymModal';wrap.style.cssText='position:fixed;inset:0;background:#17212699;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px';
 wrap.innerHTML=`<div role="dialog" aria-modal="true" aria-labelledby="shareGymTitle" class="card" style="max-width:480px;width:100%;box-shadow:0 12px 40px #0004"><div class="row between"><div class="subtitle" id="shareGymTitle">Compartir GYM LOG</div><button type="button" class="ghost" id="shareGymClose" aria-label="Cerrar">✕</button></div><p>Comparte este enlace con tu amigo:</p><input id="shareGymUrl" type="text" readonly value="${url}" style="margin:4px 0 10px"><div id="shareGymStatus" class="small muted" role="status" style="margin:5px 0 10px">Pulsa «Copiar enlace» o selecciona y copia la dirección.</div><div class="actions"><button type="button" id="shareGymCopy">Copiar enlace</button><button type="button" class="secondary" id="shareGymNative">Compartir…</button><button type="button" class="ghost" id="shareGymSelect">Seleccionar enlace</button></div></div>`;
 document.body.appendChild(wrap);
 const field=wrap.querySelector('#shareGymUrl'),status=wrap.querySelector('#shareGymStatus'),close=()=>wrap.remove();
 wrap.querySelector('#shareGymClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()};
 wrap.querySelector('#shareGymSelect').onclick=()=>{field.focus();field.select();status.textContent='Enlace seleccionado. Usa Ctrl+C (o Mantén pulsado y Copiar en el móvil).'};
 wrap.querySelector('#shareGymCopy').onclick=async()=>{let copied=false;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(url);copied=true}}catch(e){}if(!copied){try{field.focus();field.select();copied=document.execCommand('copy')}catch(e){copied=false}}status.textContent=copied?'Enlace copiado. Ya puedes pegarlo y enviarlo.':'El navegador no permitió copiar automáticamente. El enlace está seleccionado; cópialo manualmente.';if(!copied){field.focus();field.select()}};
 wrap.querySelector('#shareGymNative').onclick=async()=>{try{if(navigator.share){await navigator.share({title:'GYM LOG',text:'Prueba GYM LOG para organizar tus entrenamientos:',url});status.textContent='Se ha abierto el menú para compartir.'}else{field.focus();field.select();status.textContent='Este navegador no ofrece el menú de compartir. Copia el enlace seleccionado.'}}catch(e){if(e?.name!=='AbortError')status.textContent='No se pudo abrir el menú de compartir. Puedes copiar el enlace manualmente.'}};
 field.focus();field.select();
}
async function shareRoutine(r){const data=JSON.stringify({format:'gymlog-routine',version:1,routine:r},null,2);const filename=`${safeName(r.name)}.gymlog`;try{const file=new File([data],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:`Rutina ${r.name} · GYM LOG`,text:'Te comparto esta rutina para importarla en GYM LOG.',files:[file]});return}}catch(e){if(e?.name==='AbortError')return}download(data,filename,'application/json');alert('Se ha exportado únicamente esta rutina. Envíale el archivo .gymlog a tu amigo; podrá importarlo sin compartir tus otras rutinas ni tu historial.')}

function viewSession(id){let s=db.sessions.find(s=>s.id===id);if(!s)return;$('#main').innerHTML=`<div class="title">${esc(s.routineNameSnapshot)} · ${esc(s.dayNameSnapshot)}</div><div class="card"><div class="muted">${new Date(s.completedAt).toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'})}</div>${s.exercises.map(e=>`<div class="exercise"><button type="button" class="exercise-open" data-exercise-detail="history" data-exercise-id="${esc(e.id)}" data-session-id="${esc(s.id)}"><b>${esc(e.exerciseNameSnapshot)}</b> <span class="exercise-open-icon">ⓘ</span></button><div class="small muted">${esc(e.variant||'')}</div>${e.sets.map((x,i)=>`<div class="row between small" style="padding:4px 0"><span>Serie ${i+1}</span><span>${x.weight!==''?esc(x.weight)+' '+db.settings.unit+' × ':''}${esc(x.reps||x.duration||'—')} ${x.completed?'✓':'—'}</span></div>`).join('')}${e.notes?`<p class="small muted">${esc(e.notes)}</p>`:''}</div>`).join('')}<button class="secondary" data-go="history">Volver al historial</button></div>`;bind()}
function dayNameFromRoutine(r){return r.days[0]?.id||''}
function offerBackupReminder(){const pref=db.settings?.backupReminder||{mode:'ask',until:0};if(pref.mode==='never'||(pref.mode==='snooze'&&Date.now()<Number(pref.until||0)))return;if($('#backupReminderModal'))return;const wrap=document.createElement('div');wrap.id='backupReminderModal';wrap.style.cssText='position:fixed;inset:0;background:#17212688;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px';wrap.innerHTML=`<div class="card" style="max-width:440px;width:100%;box-shadow:0 12px 40px #0003"><div class="subtitle">¿Hacemos una copia de seguridad?</div><p>Has guardado cambios importantes. Descarga un archivo en tu dispositivo para poder recuperar tus rutinas y entrenamientos si borras los datos del navegador o cambias de móvil.</p><div class="actions"><button id="backupReminderNow">Descargar copia ahora</button><button class="secondary" id="backupReminderWeek">No recordar esta semana</button><button class="ghost" id="backupReminderNever">No recordar nunca</button><button class="ghost" id="backupReminderClose">Ahora no</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();$('#backupReminderNow').onclick=()=>{download(JSON.stringify({...db,exportedAt:now(),format:'gymlog-backup'},null,2),'gymlog-copia-'+new Date().toISOString().slice(0,10)+'.json','application/json');close()};$('#backupReminderWeek').onclick=()=>{db.settings.backupReminder={mode:'snooze',until:Date.now()+7*864e5};save();close()};$('#backupReminderNever').onclick=()=>{db.settings.backupReminder={mode:'never',until:0};save();close()};$('#backupReminderClose').onclick=close;wrap.onclick=e=>{if(e.target===wrap)close()}}
function download(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeName(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'rutina'}
function restoreFile(ev){
 const f=ev.target.files?.[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const obj=JSON.parse(reader.result);
   const remapRoutine=(source)=>{
    const r=JSON.parse(JSON.stringify(source));r.id=uid();r.isTemplate=false;r.active=true;r.createdAt=r.createdAt||now();
    if(!Array.isArray(r.days)||!r.days.length)throw Error('La rutina importada no contiene días.');
    r.days.forEach(d=>{d.id=uid();d.name=String(d.name||'Día');if(!Array.isArray(d.exercises))d.exercises=[];d.exercises.forEach(e=>{e.id=uid();const name=String(e.name||'Ejercicio');let local=db.library.find(x=>x.name.toLocaleLowerCase('es')===name.toLocaleLowerCase('es'));if(!local){local={...exercise(name,'General y funcional','General','Otro'),isCustom:true};db.library.push(local)}e.name=name;e.exerciseId=local.id;e.sets=Math.max(1,Number(e.sets)||3);e.reps=String(e.reps||'8–12');if(!e.metric)e.metric='reps';if(!e.rest)e.rest=120})});
    if(db.routines.some(x=>x.name===r.name))r.name+=' (importada)';return r;
   };
   if(obj.format==='gymlog-routine'&&obj.routine){db.routines.push(remapRoutine(obj.routine))}
   else if(obj.format==='gymlog-backup'&&Array.isArray(obj.library)&&Array.isArray(obj.routines)&&Array.isArray(obj.sessions)){
    if(!confirm('¿Fusionar la copia con los datos actuales? Aceptar = fusionar, Cancelar = reemplazar.')){
     if(!confirm('¿Seguro que quieres reemplazar todos los datos actuales?'))return;
     db=JSON.parse(JSON.stringify(obj));delete db.exportedAt;
    }else{
     const existingNames=new Set(db.routines.map(r=>r.name));
     obj.routines.forEach(source=>{if(!existingNames.has(source.name)){const r=JSON.parse(JSON.stringify(source));db.routines.push(r);existingNames.add(r.name)}});
     const sessionIds=new Set(db.sessions.map(s=>s.id));db.sessions.push(...obj.sessions.filter(s=>!sessionIds.has(s.id)));
     const exerciseIds=new Set(db.library.map(e=>e.id));db.library.push(...obj.library.filter(e=>!exerciseIds.has(e.id)));
     if(!db.activeSession&&obj.activeSession)db.activeSession=JSON.parse(JSON.stringify(obj.activeSession));
    }
   }else if(obj.format==='gymlog-routines'&&Array.isArray(obj.routines)){obj.routines.forEach(r=>db.routines.push(remapRoutine(r)))}
   else throw Error('Formato no reconocido');
   normalizeDatabase();save();alert('Importación completada.');go('home');
  }catch(e){alert('No se pudo importar el archivo: '+(e?.message||'archivo no válido'))}
  ev.target.value='';
 };
 reader.onerror=()=>{alert('No se pudo leer el archivo seleccionado.');ev.target.value=''};
 reader.readAsText(f);
}

function getRemaining(){return timer.running?Math.max(0,(timer.end-Date.now())/1000):timer.remaining}
function formatTime(sec){sec=Math.max(0,Math.ceil(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function tick(){if(timer.running){timer.remaining=getRemaining();if(timer.remaining<=0){timer.running=false;timer.remaining=0;try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}if(page==='timer')render();else{const btn=$('[data-action="open-timer"]');if(btn)btn.textContent='⏱ Descanso terminado'}}else if(page==='timer'){let d=$('#timerDigits');if(d)d.textContent=formatTime(timer.remaining);let sub=$('#topSub');if(sub)sub.textContent='Descanso: '+formatTime(timer.remaining)}}}
function editUnused(){}
$('#quickResume').onclick=()=>{page='workout';render()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});load();save();render();showPrivacyNotice();(async()=>{await loadProConfig();await syncExternalCatalog();await syncExternalTemplates();render()})();if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('No se pudo registrar el modo instalable:',e)))}setInterval(tick,250);
})();
